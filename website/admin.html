<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ-панель — English Learning</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-shell">
    <section id="loginView" class="panel login-panel">
      <h1>Админ-панель</h1>
      <p>Введите пароль администратора.</p>
      <form id="loginForm">
        <label for="password">Пароль</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">Войти</button>
      </form>
      <p id="loginMessage" class="message" aria-live="polite"></p>
    </section>

    <section id="adminView" class="panel" hidden>
      <header class="toolbar header-toolbar">
        <div>
          <h1>Общий словарь</h1>
          <p id="summary">Загрузка…</p>
        </div>
        <button id="logoutButton" class="secondary" type="button">Выйти</button>
      </header>

      <form id="addForm" class="add-form">
        <input id="newCardId" type="number" min="1" placeholder="Карточка" required>
        <input id="newEn" type="text" maxlength="120" placeholder="English word" required>
        <input id="newRu" type="text" maxlength="255" placeholder="Перевод" required>
        <button type="submit">Добавить слово</button>
      </form>

      <div class="toolbar search-toolbar">
        <input id="searchInput" type="search" placeholder="Поиск по слову или переводу">
        <button id="searchButton" type="button">Найти</button>
        <button id="resetSearchButton" class="secondary" type="button">Сбросить</button>
      </div>

      <p id="adminMessage" class="message" aria-live="polite"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Карточка</th>
              <th>Слово</th>
              <th>Перевод</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="wordsBody"></tbody>
        </table>
      </div>

      <nav class="pagination" aria-label="Страницы словаря">
        <button id="prevPage" class="secondary" type="button">← Назад</button>
        <span id="pageInfo"></span>
        <button id="nextPage" class="secondary" type="button">Далее →</button>
      </nav>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
