<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telegram — LearEnglish</title><link rel="icon" type="image/png" href="images/favicon.png"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Arial,sans-serif;background:linear-gradient(145deg,#f7f8ff,#eef3ff);color:#30354d}.card{width:min(100%,520px);padding:30px 24px;border-radius:28px;background:rgba(255,255,255,.88);box-shadow:0 22px 60px rgba(77,91,150,.15);text-align:center}.logo{width:min(280px,75%);height:auto;filter:drop-shadow(0 0 15px rgba(105,118,255,.25))}.lead{color:#747b95;line-height:1.55}.steps{text-align:left;margin:24px 0;display:grid;gap:12px}.step{padding:14px 16px;border-radius:16px;background:#f6f7ff}.num{display:inline-grid;place-items:center;width:27px;height:27px;margin-right:8px;border-radius:50%;background:#667eea;color:#fff;font-weight:bold}.btn{display:block;width:100%;padding:14px;margin-top:11px;border:0;border-radius:15px;font-size:1rem;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:#667eea;color:#fff}.secondary{background:#eef0ff;color:#5868c7}</style></head><body><main class="card"><img class="logo" src="images/lear-logo.png" alt="LearEnglish"><h1>Синхронизация с Telegram</h1><p class="lead">Чтобы сохранить и синхронизировать прогресс, выполните три простых шага.</p><div class="steps"><div class="step"><span class="num">1</span>Откройте Telegram-бота LearEnglish.</div><div class="step"><span class="num">2</span>Нажмите <strong>Start</strong> в боте.</div><div class="step"><span class="num">3</span>Вернитесь на сайт через кнопку <strong>🌐Сайт</strong> в Telegram.</div></div><a class="btn primary" href="https://t.me/YOUR_BOT_USERNAME">🤖 Перейти в Telegram</a><a class="btn secondary" href="/">← Вернуться на сайт</a></main></body></html>
